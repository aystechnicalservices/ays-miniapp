services:
  - type: web
    name: ays-checklist
    runtime: python
    plan: starter # NOT free: the free plan sleeps when idle, which stops the
      # bot polling for updates and kills any scheduled plan send.
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /healthz
    disk:
      # The container filesystem is wiped on every deploy. Without this disk
      # the SQLite database — the whole library, every plan, all tick history
      # — is lost each time you push.
      name: ays-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: TIMEZONE
        value: Asia/Dubai
      # Set in the Render dashboard, not here — these are secrets and this
      # file is committed.
      - key: BOT_TOKEN
        sync: false
      - key: BOSS_ID
        sync: false
      - key: STORAGE_CHAT_ID
        sync: false
      - key: EXTRA_BOSS_IDS
        sync: false
      - key: CREW_IDS
        sync: false
      # Your https://<service>.onrender.com URL. Render only knows it after
      # the first deploy, so add it then and redeploy.
      - key: PUBLIC_URL
        sync: false
