<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Library</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1 id="heading" class="date-toggle"></h1>
    </header>

    <div id="banner" class="hidden"></div>

    <div id="progress"></div>

    <form id="ai-draft-form">
      <textarea id="ai-draft-text" rows="2" placeholder="Describe the whole day — e.g. &quot;908: pool + entrance clean; 1002: soil removal; new: waterproof 908 roof&quot;"></textarea>
      <button type="submit">Draft plan with AI</button>
    </form>

    <form id="ai-add-form">
      <input type="text" id="ai-add-text" placeholder="Describe a task — AI will match or add it" autocomplete="off" />
      <button type="submit">Add with AI</button>
    </form>

    <form id="add-form">
      <input type="text" id="add-text" placeholder="New item text" autocomplete="off" />
      <input type="text" id="add-villa" placeholder="Villa" autocomplete="off" list="villa-list" />
      <datalist id="villa-list"></datalist>
      <input type="text" id="add-section" placeholder="Section (optional)" autocomplete="off" list="section-list" />
      <datalist id="section-list"></datalist>
      <button type="submit">Add</button>
    </form>

    <main id="list"></main>
  </div>

  <div id="send-bar">
    <div id="send-row">
      <span id="send-count">0 selected</span>
      <button type="button" id="send-now-btn">Send now</button>
    </div>
  </div>

  <div id="toast" class="hidden"></div>

  <script src="/static/boss.js"></script>
</body>
</html>
