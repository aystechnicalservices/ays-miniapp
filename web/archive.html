<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Archive</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Archive</h1>
    </header>

    <div id="banner" class="hidden"></div>

    <div id="history-list"></div>
    <div id="history-detail" class="hidden">
      <button type="button" id="history-back-btn">&larr; Back to plan list</button>
      <div id="history-heading"></div>
      <div id="history-items"></div>
    </div>
  </div>

  <div id="viewer" class="hidden">
    <button type="button" id="viewer-close" aria-label="Close">&times;</button>
    <div id="viewer-content"></div>
  </div>

  <script src="/static/archive.js"></script>
</body>
</html>
